[build]
builder = "NIXPACKS"
buildCommand = "NITRO_PRESET=node-server node scripts/with-app-env.mjs vite build"
watchPatterns = ["src/**", "package.json", "package-lock.json", "vite.config.ts", "migrations/**"]

[deploy]
startCommand = "npm start"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
